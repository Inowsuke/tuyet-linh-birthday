    :root{--cream:#fbf7ef;--paper:#fffdf8;--ink:#4d493d;--muted:#797363;--rose:#b75d50;--peach:#f4d6c6;--sage:#dfe5d5;--line:#e5dfd2;--hand:Mali,'Segoe Print','Comic Sans MS',cursive;--body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:28px}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    button,input,textarea{font:inherit}
    button,a,input,textarea{-webkit-tap-highlight-color:transparent}
    button,a{touch-action:manipulation}
    button{color:inherit;cursor:pointer}
    button:disabled{cursor:wait;opacity:.65}
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,article:focus-visible{outline:3px solid #8c9e79;outline-offset:5px}
    a{color:inherit;text-decoration:none}
    svg{display:block;max-width:100%}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .wrap{width:min(1080px,calc(100% - 64px));margin-inline:auto}
    .hand{font-family:var(--hand)}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;line-height:1.6}
    .skip-link{position:fixed;top:-90px;left:16px;z-index:50;padding:10px 18px;background:var(--paper);border-radius:12px}
    .skip-link:focus{top:12px}
    .nav{height:98px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.13em;font-weight:600}
    .brand svg{width:24px;height:24px;color:var(--rose)}
    .nav-right{display:flex;align-items:center;gap:20px}
    .nav-date{font-family:var(--hand);font-size:20px}
    .effects-toggle{border:1px solid var(--line);background:transparent;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
    .effects-toggle:hover{background:var(--sage)}
    .effects-toggle svg{width:19px;height:19px}
    .hero{min-height:620px;display:grid;grid-template-columns:1.12fr 1fr;align-items:center;gap:24px;padding-block:66px 72px;position:relative}
    .hero-kicker{display:flex;align-items:center;gap:9px;color:var(--muted);margin:0 0 23px}
    .hero-kicker::before{content:'';width:7px;height:7px;border-radius:50%;background:#c28f63}
    h1{font-family:var(--hand);font-size:clamp(38px,4.8vw,58px);font-weight:400;line-height:1.35;letter-spacing:-.04em;margin:0 0 20px}
    h1 .recipient{display:inline-block;color:var(--rose);font-size:1.24em;font-weight:600;position:relative;white-space:nowrap}
    h1 .recipient::after{content:'';position:absolute;bottom:2px;left:1%;width:99%;height:9px;border-bottom:2px solid #c9987f;border-radius:0 0 50% 40%;transform:rotate(-2deg);opacity:.7}
    .hero-desc{max-width:37ch;color:var(--muted);font-size:15px;line-height:1.9;margin:0 0 29px}
    .primary-link{display:inline-flex;align-items:center;gap:24px;background:var(--sage);padding:13px 21px;border:1px solid #ccd4c1;border-radius:100px;font-size:13px;font-weight:600;transition:transform .2s,background .2s}
    .primary-link:hover{transform:translateY(-3px);background:#d3ddc9}
    .primary-link svg{width:16px;height:16px}
    .hero-from{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:17px 0 0}
    .hero-art{position:relative;isolation:isolate;width:100%;max-width:440px;justify-self:end}
    .cake-art{width:100%;overflow:visible}
    .cake-art .balloon{transform-box:fill-box;transform-origin:center bottom;animation:balloon-drift 7s ease-in-out infinite alternate}
    .cake-art .balloon.rose{animation-delay:-3s;animation-duration:8s}
    .cake-art .flame{transform-origin:221px 191px;animation:candle-glow 1.9s ease-in-out infinite alternate}
    .cake-art .twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 4.7s ease-in-out infinite}
    .cake-art .twinkle:nth-of-type(2n){animation-delay:-2.6s}
    .art-note{position:absolute;right:0;bottom:14px;font-family:var(--hand);font-size:14px;transform:rotate(-6deg);color:#85836a}
    .art-note::before{content:'';display:block;width:40px;height:22px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;border-radius:0 0 0 100%;transform:rotate(18deg);position:absolute;top:-32px;left:30px}
    .birthday-strip{border-block:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:24px;padding:18px 12px;font-size:11px;letter-spacing:.2em;text-align:center;color:var(--muted)}
    .birthday-strip svg{width:18px;height:18px;flex-shrink:0;color:#b29562}
    .wishes{padding-block:83px 72px}
    .section-intro{text-align:center;max-width:560px;margin:0 auto 36px}
    .section-intro .eyebrow{color:var(--rose);margin:0 0 13px}
    h2{font-family:var(--hand);font-weight:400;line-height:1.5;font-size:clamp(27px,3.5vw,36px);letter-spacing:-.03em;margin:0 0 13px}
    .section-intro>p:last-child{font-size:14px;color:var(--muted);line-height:1.9;margin:0}
    .notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .note{position:relative;padding:29px 31px 30px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 0 #d9d0be16;overflow:hidden}
    .note::after{content:'';position:absolute;width:64px;height:18px;right:25px;top:-5px;background:#eadcc582;transform:rotate(6deg)}
    .note:nth-child(2)::after{background:#d9e1d699;transform:rotate(-7deg)}
    .note:nth-child(3)::after{background:#ead5d08c;transform:rotate(-4deg)}
    .note:nth-child(4)::after{background:#e6dccb99;transform:rotate(8deg)}
    .note-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
    .note-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f6e7d5;color:#9c7552}
    .note:nth-child(2) .note-icon{background:#e9eddf;color:#7c8767}
    .note:nth-child(3) .note-icon{background:#f9e4df;color:#b77d77}
    .note:nth-child(4) .note-icon{background:#f7edd0;color:#ab8a44}
    .note-icon svg{width:25px;height:25px}
    .note-number{font-family:var(--hand);color:#9b9584;font-size:13px}
    .note h3{font-family:var(--hand);font-size:22px;font-weight:600;line-height:1.55;margin:0 0 12px;letter-spacing:-.02em}
    .note p{font-size:14px;line-height:1.95;color:#716b5f;margin:0}
    .friend-note{max-width:690px;margin:40px auto 0;text-align:center;padding:14px 24px}
    .friend-note .little-star{color:#b4915f;width:23px;margin:0 auto 18px}
    .friend-note h3{font-family:var(--hand);font-size:22px;font-weight:400;line-height:1.6;margin:0 0 12px}
    .friend-note p{font-size:14px;line-height:1.9;color:var(--muted);margin:0}
    .gift-section{position:relative;background:#f1eee4;border-block:1px solid #e5dfd1;padding:65px 0 59px;text-align:center;overflow:hidden}

    .ritual-flare{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,#fff4d4,#e9d1ac8c 25%,transparent 75%);opacity:0}

    .arrived .chest-scene{opacity:0;transform:translate(-50%,-55%) scale(.55);transition:opacity .5s,transform .8s var(--ease-out)}

    @keyframes hero-awaken{from{opacity:0;transform:translateY(22px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}

    @keyframes chest-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    @keyframes chest-shine{0%,58%{transform:translateX(-120%)}83%,100%{transform:translateX(120%)}}
    @keyframes sky-breathe{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.85;transform:scale(1.1)}}
    @keyframes seal-arrive{from{opacity:0;transform:scale(.65) rotate(-40deg);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}

    @keyframes intro-words-depart{to{opacity:0;transform:scale(1.1) translateY(-10px);filter:blur(5px)}}

    @media(hover:hover){.note:hover{transform:translateY(-3px)}.primary-link:active,.unlock-button:active{transform:scale(.98)}}

    @media(max-width:360px){.brand{letter-spacing:.02em;gap:6px}.brand svg{width:19px}.nav-right{gap:6px}.nav-date{font-size:13px}.effects-toggle,.sound-toggle{width:32px;height:32px}.intro-dialog h2{font-size:43px}.intro-seal{width:74px;height:74px;margin-bottom:20px}.intro-seal svg{inset:22px;width:30px;height:30px}.intro-eyebrow{margin-bottom:25px}.hero{padding-top:35px}}
    @media(prefers-reduced-motion:reduce){.motion-ready .reveal{filter:none}.intro-layout,.intro-dialog,.hero-copy>*,.cake-art{opacity:1!important;filter:none!important;transform:none!important}}

      const generation=++revealGeneration;
      const content=$('letter-content');content.replaceChildren();
      text.split(/\n\s*\n/).forEach((paragraph,i)=>{const p=document.createElement('p');p.className='letter-paragraph';p.style.setProperty('--paragraph-delay',`${.12+i*.2}s`);p.textContent=paragraph;content.append(p);});
      $('letter-paper').scrollTop=0;$('letter-shell').setAttribute('inert','');
      lockScroll();stopConfetti();letterDialog.showModal();
      $('skip-animation').hidden=!effectsEnabled;letterDialog.setAttribute('aria-busy','true');
      $('opening-status').textContent=COPY.openingStatus;
      if(!effectsEnabled){finishReveal();return;}
      visualFX.beginStage();playCue('charge');
      openingFrame=requestAnimationFrame(()=>{if(letterDialog.open&&generation===revealGeneration)letterDialog.classList.add('gathering');});
      function later(delay,action){openingTimers.push(setTimeout(()=>{if(letterDialog.open&&generation===revealGeneration)action();},delay));}
      later(600,()=>{letterDialog.classList.add('charged');$('opening-status').textContent=COPY.chargeStatus;});
      later(1250,()=>letterDialog.classList.add('opening'));
      later(2050,()=>letterDialog.classList.add('flare'));
      later(3100,finishReveal);
    }
    function finishReveal(){
      if(!letterDialog.open||letterDialog.classList.contains('arrived'))return;
      openingTimers.forEach(clearTimeout);openingTimers=[];cancelAnimationFrame(openingFrame);
      letterDialog.classList.remove('flare');letterDialog.classList.add('arrived');letterDialog.removeAttribute('aria-busy');
      $('letter-shell').removeAttribute('inert');$('letter-paper').scrollTop=0;$('skip-animation').hidden=true;
      $('opening-status').textContent=COPY.letterReady;visualFX.settleStage();playCue('ready');
    }
    $('skip-animation').addEventListener('click',()=>{finishReveal();$('close-letter').focus({preventScroll:true});});
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(busy)return;
      if(!normalizePassword(input.value)){rejectPassword(COPY.emptyPassword);input.focus({preventScroll:true});return;}
      if(!globalThis.crypto?.subtle){feedback.textContent=COPY.cryptoUnavailable;return;}
      busy=true;$('unlock-button').disabled=true;form.setAttribute('aria-busy','true');$('unlock-button-text').textContent=COPY.unlocking;feedback.textContent='';
      try{const text=await decryptLetter(input.value);input.value='';input.removeAttribute('aria-invalid');input.type='password';$('toggle-password').innerHTML=icon('eye');$('toggle-password').setAttribute('aria-label',COPY.showPassword);$('toggle-password').setAttribute('aria-pressed','false');showLetter(text);}
      catch(error){if(error.name==='OperationError'){rejectPassword(COPY.wrongPasswords[attempts++%COPY.wrongPasswords.length]);}else{feedback.textContent=COPY.giftBroken;}}
      finally{busy=false;$('unlock-button').disabled=false;form.removeAttribute('aria-busy');$('unlock-button-text').textContent=COPY.unlock;}
    });
    function cleanupLetter(){
      if(!letterLive)return;letterLive=false;
      revealGeneration++;
      openingTimers.forEach(clearTimeout);openingTimers=[];cancelAnimationFrame(openingFrame);
      letterDialog.classList.remove('gathering','charged','opening','flare','arrived');letterDialog.removeAttribute('aria-busy');$('letter-content').replaceChildren();$('opening-status').textContent='';$('letter-shell').setAttribute('inert','');
      visualFX.endStage();visualFX.setBlocked(false);unlockScroll();$('chest-button').focus({preventScroll:true});
    }
    function closeLetter(){if(letterDialog.open)letterDialog.close();cleanupLetter();}
    $('close-letter').addEventListener('click',closeLetter);
    letterDialog.addEventListener('click',e=>{if(e.target===letterDialog)closeLetter();});
    letterDialog.addEventListener('cancel',e=>{e.preventDefault();closeLetter();});
    letterDialog.addEventListener('close',()=>{if(!letterDialog.open)cleanupLetter();});

    /* Mở thiệp bằng một lần chạm; Esc vẫn đóng được màn giới thiệu. */
    function enterWorld(){
      if(!introDialog.open||introFinishing)return;introFinishing=true;$('intro-start').disabled=true;playCue('enter');introDialog.classList.add('leaving');
      introTimer=setTimeout(closeIntro,effectsEnabled?930:0);
    }
    $('intro-start').addEventListener('click',enterWorld);
    function cleanupIntro(){
      if(!introLive)return;introLive=false;
      clearTimeout(introTimer);introFinishing=false;introDialog.classList.remove('leaving');$('intro-start').disabled=false;
      unlockScroll();document.body.classList.add('world-entered');visualFX.setBlocked(false);
      if(location.hash!=='#soan-thu'){const title=$('birthday-title');title.setAttribute('tabindex','-1');title.focus({preventScroll:true});confettiDelay=setTimeout(celebrate,250);}
    }
    function closeIntro(){if(introDialog.open)introDialog.close();cleanupIntro();}
    introDialog.addEventListener('cancel',e=>{e.preventDefault();closeIntro();});
    introDialog.addEventListener('close',()=>{if(!introDialog.open)cleanupIntro();});

    /* Công cụ soạn tùy chọn: tạo mật mã mới mà không cần sửa hàm mã hóa. */
    const editorDialog=$('editor-dialog');let editorBusy=false,editorGeneration=0;
    function maybeOpenEditor(){if(location.hash!=='#soan-thu'||editorDialog.open)return;if(introDialog.open)closeIntro();if(letterDialog.open)closeLetter();lockScroll();visualFX.setBlocked(true);editorDialog.showModal();}
    $('close-editor').addEventListener('click',()=>editorDialog.close());
    editorDialog.addEventListener('close',()=>{editorGeneration++;$('editor-form').reset();$('secret-output').value='';$('editor-result').hidden=true;$('editor-status').textContent='';visualFX.setBlocked(false);unlockScroll();if(location.hash==='#soan-thu')history.replaceState(null,'',location.pathname+location.search);});
    window.addEventListener('hashchange',maybeOpenEditor);
    $('load-letter').addEventListener('click',async()=>{
      if(editorBusy)return;if(!crypto?.subtle){$('editor-status').textContent=COPY.cryptoUnavailable;return;}
      const generation=editorGeneration;editorBusy=true;$('load-letter').disabled=true;
      try{const text=await decryptLetter($('old-password').value);if(generation!==editorGeneration||!editorDialog.open)return;$('editor-text').value=text;$('old-password').value='';$('editor-status').textContent=COPY.editorLoaded;}
      catch{$('editor-status').textContent=COPY.editorLoadFailed;}
      finally{editorBusy=false;$('load-letter').disabled=false;}
    });
    $('editor-form').addEventListener('submit',async event=>{
      event.preventDefault();if(editorBusy)return;
      const text=$('editor-text').value,password=$('new-password').value;
      if(!text.trim()||!normalizePassword(password)){$('editor-status').textContent=COPY.editorMissing;return;}
      if(!crypto?.subtle){$('editor-status').textContent=COPY.cryptoUnavailable;return;}
      const generation=editorGeneration;editorBusy=true;$('generate-secret').disabled=true;$('editor-status').textContent=COPY.editorWorking;
      try{const secret=await sealLetter(text,password);if(generation!==editorGeneration||!editorDialog.open)return;$('secret-output').value=`const SECRET = ${JSON.stringify(secret,null,2)};`;$('editor-result').hidden=false;$('new-password').value='';$('editor-status').textContent=COPY.editorDone;}
      catch{$('editor-status').textContent=COPY.giftBroken;}
      finally{editorBusy=false;$('generate-secret').disabled=false;}
    });
    $('copy-secret').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('secret-output').value);$('editor-status').textContent=COPY.editorCopied;}catch{$('secret-output').focus();$('secret-output').select();$('editor-status').textContent=COPY.editorSelectCopy;}});
    maybeOpenEditor();
    if(!location.hash){introLive=true;lockScroll();visualFX.setBlocked(true);introDialog.showModal();}else{document.body.classList.add('world-entered');}
  </script>
</body>
</html>
